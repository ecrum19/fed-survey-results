<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Federated Query Dashboard favicon">
  <defs>
    <!-- Color-blind friendly palette consistent with dashboard accents. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background keeps icon crisp across browser UI contexts. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>

  <!-- Lightweight federation motif: three endpoints + links + center query node. -->
  <line x1="17" y1="20" x2="32" y2="34" stroke="#67e8f9" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="47" y1="20" x2="32" y2="34" stroke="#facc15" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="34" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round"/>

  <circle cx="17" cy="20" r="6.2" fill="#67e8f9"/>
  <circle cx="47" cy="20" r="6.2" fill="#facc15"/>
  <circle cx="32" cy="48" r="6.2" fill="#a78bfa"/>

  <circle cx="32" cy="34" r="8.3" fill="#f8fafc"/>
  <path d="M29 31h6M29 34h6M29 37h6" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#334155" stroke-width="1.2"/>
</svg>
