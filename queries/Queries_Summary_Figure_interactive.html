<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive SPARQL Query Complexity</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #d8e0ea;
      --text: #1f2a36;
      --muted: #56718a;
    }
    body {
      margin: 0;
      font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px 12px;
      box-shadow: 0 1px 6px rgba(18, 38, 61, 0.05);
    }
    .title {
      margin: 0 0 8px;
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 8px;
    }
    .legend-box {
      border: 1px solid #ccd8e6;
      border-radius: 8px;
      background: #f8fbff;
      padding: 8px 10px;
      min-width: 240px;
    }
    .legend-title {
      margin: 0 0 6px;
      font-size: 1rem;
      font-weight: 800;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #2b445c;
      margin: 4px 0;
    }
    .legend-swatch {
      width: 24px;
      height: 12px;
      border: 1px solid #667d95;
      box-sizing: border-box;
      display: inline-block;
      border-radius: 2px;
    }
    .plot-wrap {
      overflow-x: auto;
      border: 1px solid #ced9e6;
      border-radius: 8px;
      background: #ffffff;
      position: relative;
    }
    svg {
      display: block;
      min-height: 420px;
    }
    .axis-label {
      fill: #20384f;
      font-size: 17px;
      font-weight: 700;
    }
    .tick-label {
      fill: #4a637b;
      font-size: 12px;
    }
    .y-tick {
      fill: #4a637b;
      font-size: 14px;
      font-weight: 600;
    }
    .grid-line {
      stroke: #d9e3ef;
      stroke-width: 1;
      stroke-dasharray: 5 4;
    }
    .bar {
      cursor: pointer;
      transition: opacity 90ms linear;
    }
    .bar:hover {
      opacity: 0.82;
      stroke: #1d2c3b;
      stroke-width: 1.1;
    }
    .bar-hitbox {
      cursor: pointer;
    }
    .symbol {
      font-size: 16px;
      font-weight: 800;
      fill: #0f1720;
      text-anchor: middle;
      font-family: "Courier New", monospace;
      pointer-events: none;
    }
    .x-label {
      fill: #4d6980;
      font-size: 12px;
      text-anchor: end;
    }
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      border: 1px solid #9db9d3;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 8px 24px rgba(24, 45, 70, 0.15);
      font-size: 13px;
      min-width: 250px;
      max-width: 420px;
      display: none;
      white-space: normal;
      color: #13293d;
    }
    .tooltip .head {
      font-weight: 800;
      margin-bottom: 6px;
      color: #173a59;
    }
    .foot {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>

      </div>
      <div class="legend-box">

    </div>
    <div class="plot-wrap">
      <svg id="chart" role="img" aria-label="Interactive SPARQL query complexity chart"></svg>

    <p class="foot">Hover bars for detailed query metadata. Scroll horizontally if needed.</p>
